<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #e7ecf2;
    --surface: #ffffff;
    --surface-2: #dde4ed;
    --line: #c2ccda;
    --ink: #141b24;
    --ink-soft: #4a5666;
    --ink-faint: #77839a;
    --accent: #b4621a;
    --accent-ink: #ffffff;
    --accent-soft: #f5e3d1;
    --live: #0f7a6b;
    --live-soft: #d5ebe6;
    --closed: #8b93a3;
    --shadow: 0 1px 2px rgba(20, 27, 36, .08), 0 8px 24px -16px rgba(20, 27, 36, .5);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #080c12;
      --surface: #18212e;
      --surface-2: #232f3f;
      --line: #303f52;
      --ink: #e8edf4;
      --ink-soft: #a6b2c4;
      --ink-faint: #74829a;
      --accent: #e8a33d;
      --accent-ink: #17202b;
      --accent-soft: #34291a;
      --live: #4dc4ae;
      --live-soft: #14322e;
      --closed: #66748a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -18px rgba(0, 0, 0, .9);
    }
  }

  :root[data-theme="dark"] {
    --ground: #080c12;
    --surface: #18212e;
    --surface-2: #232f3f;
    --line: #303f52;
    --ink: #e8edf4;
    --ink-soft: #a6b2c4;
    --ink-faint: #74829a;
    --accent: #e8a33d;
    --accent-ink: #17202b;
    --accent-soft: #34291a;
    --live: #4dc4ae;
    --live-soft: #14322e;
    --closed: #66748a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -18px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 1 1 auto;
  }

  .brand h1 {
    margin: 0;
    font-family: "Chakra Petch", "Noto Sans TC", sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .01em;
  }

  .brand .count {
    font-family: "Chakra Petch", monospace;
    font-size: 13px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .find { display: flex; gap: 6px; flex: 1 1 260px; max-width: 380px; }

  input[type="search"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }

  input[type="search"]::placeholder { color: var(--ink-faint); }

  button {
    font: inherit;
    font-family: "Chakra Petch", "Noto Sans TC", sans-serif;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    padding: 7px 12px;
    white-space: nowrap;
  }

  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .filterbox { flex: 1 1 100%; }

  .filterbox > summary {
    display: none;                 /* 桌機不需要開合，直接攤開 */
  }

  @media (max-width: 700px) {
    .filterbox > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
      cursor: pointer;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      font-size: 13px;
    }

    .filterbox > summary::-webkit-details-marker { display: none; }

    .filterbox > summary::after {
      content: "▾";
      margin-left: auto;
      color: var(--ink-faint);
      transition: transform .15s ease;
    }

    .filterbox[open] > summary::after { transform: rotate(180deg); }

    .filterbox[open] > summary { margin-bottom: 8px; }

    .sum-label { font-weight: 700; color: var(--ink); }

    .sum-now {
      color: var(--accent);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  }

  /* 每組篩選 = 標籤 + 一排 chip；用 grid 讓兩欄的標籤與 chip 起點對齊 */
  .rows {
    display: grid;
    grid-template-columns: repeat(3, auto max-content);
    justify-content: start;
    align-items: center;
    gap: 6px 10px;
  }

  /* 同一列的組別之間留呼吸，但不把欄位推到畫面兩端 */
  .tag { padding-left: 26px; }
  .row:nth-child(3n+1) .tag { padding-left: 0; }

  .row { display: contents; }

  .chips {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar { display: none; }

  @media (max-width: 1280px) {
    .rows { grid-template-columns: repeat(2, auto max-content); }
    .row:nth-child(even) .tag { padding-left: 26px; }
    .row:nth-child(odd) .tag { padding-left: 0; }
  }

  @media (max-width: 900px) {
    .rows { grid-template-columns: auto minmax(0, 1fr); }
    .row .tag { padding-left: 0; }
  }

  .tag {
    font-family: "Chakra Petch", "Noto Sans TC", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--ink-soft);
    text-align: right;
    white-space: nowrap;
  }

  .chip {
    flex: none;
    font-size: 12.5px;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-weight: 500;
  }

  .chip:hover { border-color: var(--ink-faint); }

  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  main {
    padding: 12px 14px;
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    align-items: start;
  }

  .note, .empty { grid-column: 1 / -1; padding: 14px; }

  .card {
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--state, var(--line));
    border-radius: 10px;
    padding: 11px 13px 12px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 4px;
    transition: border-color .12s ease, transform .12s ease;
  }

  .card:hover { border-color: var(--ink-faint); border-left-color: var(--state, var(--line)); }
  .card:active { transform: translateY(1px); }

  .card.open { --state: var(--live); }
  .card.soon { --state: var(--accent); }
  .card.done { --state: var(--line); opacity: .62; }

  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  .when {
    font-family: "Chakra Petch", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: .02em;
  }

  .when em {
    font-style: normal;
    font-weight: 700;
    color: var(--state, var(--ink-soft));
    margin-left: 6px;
  }

  .km {
    font-family: "Chakra Petch", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .km small { font-size: 10.5px; font-weight: 500; color: var(--ink-faint); margin-left: 1px; }

  .name {
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.35;
    text-wrap: balance;
    margin-top: 1px;
  }

  .shop { font-size: 13.5px; color: var(--ink-soft); font-weight: 500; }

  .addr { font-size: 12.5px; color: var(--ink-faint); }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    margin-top: 5px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .meta .sep { color: var(--line); }

  .fee {
    font-family: "Chakra Petch", monospace;
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--surface-2);
    border-radius: 5px;
    padding: 1px 7px;
  }

  .fee.free { color: var(--live); background: var(--live-soft); }

  .deadline { margin-left: auto; }
  .deadline.urgent { color: var(--accent); font-weight: 700; }

  .note, .empty {
    text-align: center;
    color: var(--ink-faint);
    font-size: 13.5px;
    padding: 26px 14px;
  }

  .err { color: var(--accent); }

  footer {
    padding: 4px 14px 28px;
    color: var(--ink-faint);
    font-size: 12px;
    text-align: center;
  }

  footer a { color: var(--ink-soft); }
</style>

  const API = "https://lol-api.playloltcg.com/xcx/overseas/activity/list";
  const TYPES = {
    regular_play: "符文競技", nexus_night: "符文之夜",
    summoner_skirmish: "召喚師激鬥戰", regional_qualifier: "巡迴資格賽"
  };
  const MODES = {
    swiss_bo1: "瑞士制 BO1", swiss_bo3: "瑞士制 BO3",
    single_bo1: "淘汰制 BO1", single_bo3: "淘汰制 BO3"
  };
  const STATES = { 1: ["即將開始", "soon"], 2: ["報名中", "open"], 3: ["進行中", "open"], 4: ["已結束", "done"] };

  const FILTERS = [
    { key: "status", tag: "狀態", opts: [["全部", null], ["報名中", 2], ["即將開始", 1], ["進行中", 3], ["已結束", 4]] },
    { key: "type", tag: "類型", opts: [["全部", null], ["符文競技", "regular_play"], ["符文之夜", "nexus_night"], ["召喚師激鬥戰", "summoner_skirmish"], ["巡迴資格賽", "regional_qualifier"]] },
    { key: "fee", tag: "費用", opts: [["全部", null], ["免費", 0], ["≤100", 100], ["≤200", 200], ["≤300", 300]] },
    { key: "people", tag: "人數", opts: [["全部", null], ["≥8", 8], ["≥16", 16], ["≥32", 32]] },
    { key: "days", tag: "時間", opts: [["全部", null], ["1天內", 1], ["3天內", 3], ["7天內", 7], ["30天內", 30]] },
    { key: "km", tag: "距離", opts: [["全部", null], ["5km", 5], ["10km", 10], ["20km", 20], ["50km", 50]] },
    { key: "sort", tag: "排序", opts: [["距離", "dist"], ["日期", "date"], ["費用", "fee"]] }
  ];

  const picked = { status: 2, type: null, fee: null, people: null, days: null, km: null, sort: "dist" };
  let events = [], me = null;

  const $ = id => document.getElementById(id);

  function buildFilters() {
    const box = $("filters");
    for (const f of FILTERS) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="tag">${f.tag}</span><div class="chips"></div>`;
      const chips = row.querySelector(".chips");
      for (const [label, value] of f.opts) {
        const b = document.createElement("button");
        b.className = "chip";
        b.type = "button";
        b.textContent = label;
        b.setAttribute("aria-pressed", picked[f.key] === value);
        b.onclick = () => {
          picked[f.key] = value;
          for (const sib of chips.children) sib.setAttribute("aria-pressed", "false");
          b.setAttribute("aria-pressed", "true");
          render();
        };
        chips.appendChild(b);
      }
      box.appendChild(row);
    }
  }

  async function load() {
    let page = 1, all = [], total = 1;
    while (all.length < total) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pageNum: page, pageSize: 100 })
      }).then(r => r.json());
      if (res.code !== 0) throw new Error(res.message || "API 回應異常");
      total = res.result.total;
      all = all.concat(res.result.list);
      page++;
    }
    use(all.filter(e => e.province === "台灣"), null);
  }

  function use(list, snapshotDate) {
    events = list;
    events.forEach(e => { e.pos = VENUES[e.address] || null; });
    document.getElementById("source").textContent = snapshotDate
      ? "此頁無法連外，顯示 " + snapshotDate + " 的資料快照"
      : "資料為即時取得";
    render();
  }

  // 兩點球面距離（公里）
  function haversine(a, b) {
    const R = 6371, rad = d => d * Math.PI / 180;
    const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function distance(e) {
    return me && e.pos ? haversine(me, e.pos) : null;
  }

  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  function midnight(iso) {
    const d = new Date(iso + "T00:00:00");
    return isNaN(d) ? null : d;
  }

  function daysLeft(iso) {
    const d = midnight(iso);
    if (!d) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 86400000);
  }

  // 日期改成「8/22 (六)」，今明兩天直接講白話
  function dateLabel(iso) {
    const d = midnight(iso);
    if (!d) return iso;
    const gap = daysLeft(iso);
    const base = `${d.getMonth() + 1}/${d.getDate()} (${WEEK[d.getDay()]})`;
    if (gap === 0) return "今天 " + base;
    if (gap === 1) return "明天 " + base;
    return base;
  }

  function deadlineLabel(iso) {
    const gap = daysLeft(iso);
    if (gap === null) return "";
    if (gap < 0) return "報名已截止";
    if (gap === 0) return "報名今天截止";
    return `報名剩 ${gap} 天`;
  }

  // summary 上顯示目前選了什麼（預設值不列）
  function activeLabels() {
    const out = [];
    for (const f of FILTERS) {
      const hit = f.opts.find(o => o[1] === picked[f.key]);
      if (!hit) continue;
      if (f.key === "sort") out.push("依" + hit[0]);
      else if (hit[1] !== null) out.push(hit[0]);
    }
    return out;
  }

  function render() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const rows = events.filter(e => {
      if (picked.status && e.activityStatus !== picked.status) return false;
      if (picked.type && e.activityType !== picked.type) return false;
      if (picked.fee !== null && Number(e.applyAmount) > picked.fee) return false;
      if (picked.people && (e.maxUser || 0) < picked.people) return false;
      if (picked.days) {
        const gap = (new Date(e.startTime + "T00:00:00") - today) / 86400000;
        if (gap < 0 || gap > picked.days) return false;
      }
      if (picked.km !== null) {
        const d = distance(e);
        if (d === null || d > picked.km) return false;
      }
      return true;
    });

    rows.sort((a, b) => {
      if (picked.sort === "date") return a.startTime.localeCompare(b.startTime);
      if (picked.sort === "fee") return a.applyAmount - b.applyAmount;
      const da = distance(a), db = distance(b);
      if (da === null && db === null) return a.startTime.localeCompare(b.startTime);
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });

    $("count").textContent = `${rows.length} / 全台 ${events.length} 場`;
    $("sumNow").textContent = activeLabels().join("・");
    const list = $("list");
    list.innerHTML = "";
    if (!rows.length) {
      list.innerHTML = '<p class="empty">沒有符合條件的場次，放寬篩選看看。</p>';
      return;
    }
    if (!me) {
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = "按「定位」或輸入地址，即可依距離排序。";
      list.appendChild(p);
    }
    for (const e of rows) {
      const d = distance(e);
      const st = STATES[e.activityStatus] || ["", ""];
      const a = document.createElement("a");
      a.className = "card " + st[1];
      a.href = "https://tc.playloltcg.com/activity-detail.html?id=" + e.id;
      a.target = "_blank";
      a.rel = "noopener";
      const fee = Number(e.applyAmount);
      const left = daysLeft(e.applyEndTime);
      a.innerHTML = `
        <div class="head">
          <span class="when">${dateLabel(e.startTime)}<em>${st[0]}</em></span>
          ${d === null ? "" : `<span class="km">${d.toFixed(1)}<small>km</small></span>`}
        </div>
        <div class="name"></div>
        <div class="shop"></div>
        <div class="addr"></div>
        <div class="meta">
          <span class="fee ${fee ? "" : "free"}">${fee ? "$" + fee : "免費"}</span>
          <span>${TYPES[e.activityType] || e.activityType}</span>
          <span class="sep">/</span>
          <span>${MODES[e.battleMode] || ""}</span>
          <span class="sep">/</span>
          <span>上限 ${e.maxUser} 人</span>
          <span class="deadline ${left !== null && left <= 2 ? "urgent" : ""}">${deadlineLabel(e.applyEndTime)}</span>
        </div>`;
      a.querySelector(".name").textContent = e.name;
      a.querySelector(".shop").textContent = e.shopName;
      a.querySelector(".addr").textContent = e.address;
      list.appendChild(a);
    }
  }

  $("locate").onclick = () => {
    const btn = $("locate");
    btn.textContent = "定位中…";
    navigator.geolocation.getCurrentPosition(
      p => { me = [p.coords.latitude, p.coords.longitude]; btn.textContent = "已定位"; render(); },
      () => { btn.textContent = "定位"; alert("取得位置失敗，請改用輸入地址。"); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  $("addr").addEventListener("keydown", async ev => {
    if (ev.key !== "Enter") return;
    const q = ev.target.value.trim();
    if (!q) { me = null; render(); return; }
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&q=" +
      encodeURIComponent(q);
    try {
      const r = await fetch(url, { headers: { "Accept-Language": "zh-TW" } }).then(r => r.json());
      if (!r.length) { alert("找不到這個地址，換個寫法試試（例如只到路名）。"); return; }
      me = [parseFloat(r[0].lat), parseFloat(r[0].lon)];
      $("locate").textContent = "已定位";
      render();
    } catch (err) {
      alert("地址查詢失敗：" + err.message);
    }
  });

  buildFilters();

  // 桌機一律攤開（收合鈕在桌機是隱藏的，關著會整條不見）；切到手機寬度才收起來
  const narrow = matchMedia("(max-width: 700px)");
  const syncFilterBox = () => { $("filterbox").open = !narrow.matches; };
  narrow.addEventListener("change", syncFilterBox);
  syncFilterBox();
  load().catch(() => use(SNAP.list, SNAP.date));
</script>
